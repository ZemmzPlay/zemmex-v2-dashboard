  {id:'nav',t:'Find your way around',s:'What each part of the sidebar and top bar does.',tour:'nav',steps:['The project switcher at the top of the sidebar shows which tournament website you’re working on. Click it to switch or create a project.','Tournaments, Users and Analytics cover day-to-day running. Website controls what visitors see. Settings covers admins and permissions.','Numbers next to menu items are things waiting for you, like score reports to verify.','Search in the top bar finds tournaments and users in the current project.','View website opens the live site in a new tab.'],tip:'Collapse the sidebar with the double arrow to get more room for tables.'},
  {id:'projects',t:'Switch between projects',s:'Run several tournament websites from one account.',steps:['Click the project switcher at the top of the sidebar.','Choose a project to switch to it. Everything you see then belongs to that project.','Choose All projects to see every website, create a new one or archive an old one.'],tip:'Archived projects are read-only and hidden from visitors, but nothing is deleted.'}]},
 {c:'tour',ic:'trophy',n:'Tournaments',d:'Create tournaments, verify scores and run brackets.',a:[
  {id:'create',t:'Create a tournament',s:'Set up the game, schedule, rules and artwork in four steps.',tour:'create',steps:['Go to Tournaments and click New tournament.','Game: pick the game, name the tournament in English (Arabic is optional) and choose a format.','Schedule: choose the timezone first. All dates use it, and the preview shows what players in other countries will see.','Rules: pick the countries that can take part — presets fill the list for you — and set match settings.','Artwork: upload the collapsed desktop card. Other sizes are optional and fall back to it.','Click Create tournament. Registration opens straight away, or use Save as draft to keep it hidden.'],tip:'You can jump back to any completed step from the list on the left.'},
  {id:'scores',t:'Verify match scores from screenshots',s:'Check the photo each player uploads and confirm the winner.',tour:'scores',steps:['When players finish a match they upload a screenshot of the result screen. It appears under Tournaments → Score reports.','Pick a report from the list. Reports where the two players disagree are marked Scores don’t match.','Click a screenshot to enlarge it and read the score the game shows.','Enter that score in the two boxes. The line underneath tells you who wins and moves on.','Click Confirm result. The bracket updates and the winner advances automatically.','If a screenshot is blurry, cropped or missing, click Ask for a new screenshot. The player gets a message and the report stays open.'],tip:'Conflicts are listed first. A cropped or edited screenshot is a common sign the report is wrong.'},
  {id:'bracket',t:'Run the bracket and advance rounds',s:'See every match, enter results by hand and move to the next round.',steps:['Click a tournament’s name to open its bracket.','Green rows show confirmed winners. Matches with a screenshot waiting show a Review button.','If a player can’t upload a screenshot, click Enter result and type the score yourself.','When every match in a round is done, click Advance to the next round.'],tip:'Manual results are recorded in Settings → Activity log with your name.'},
  {id:'standings',t:'Publish standings',s:'Show group tables on the website.',steps:['Go to Tournaments → Standings.','Click Add standings, give it a title such as Group D and pick the tournament.','Turn on Publish on the website now, or keep it as a draft.','Use the ⋯ menu on a row to publish, unpublish, edit or delete.'],tip:'Draft standings show on your dashboard so you don’t forget them.'},
  {id:'end',t:'Hide or end tournaments',s:'Take a tournament off the website or finish it early.',steps:['Tick one or more tournaments in the list. A bar appears at the bottom of the screen.','Hide removes them from the website without changing anything else. You can undo it from the message that appears.','End tournament stops matches and score reporting. You’ll see exactly which tournaments are affected before anything happens.'],tip:'Ending a tournament can’t be undone. Hiding can.'}]},
 {c:'users',ic:'users',n:'Users',d:'Add, verify and manage players.',a:[
  {id:'add',t:'Add players one by one or from a spreadsheet',s:'Register players yourself when they can’t sign up on the website.',steps:['Go to Users and click Add users.','One user: fill in name, mobile number with country code and email. Date of birth and gender are optional.','Import from a file: download the template, fill it in and drop it into the box. We check every row before importing and tell you what was skipped.'],tip:'Imported players start as Pending review until you verify them.'},
  {id:'verify',t:'Verify players and manage the blacklist',s:'Approve players before check-in and block anyone who breaks the rules.',tour:'users',steps:['Filter by Verification → Pending review to see who’s waiting.','Tick several players and click Verify in the bar at the bottom, or use the ⋯ menu on one row.','To block someone, choose Move to blacklist. They can’t register for tournaments until you remove them.','The Blacklist tab lists everyone blocked.'],tip:'Search works with names, emails and phone numbers.'}]},
 {c:'site',ic:'globe',n:'Website builder',d:'Pages, theme, colours and social links.',a:[
  {id:'pages',t:'Edit pages in English and Arabic',s:'Format text with headings, sizes, colours, alignment and links.',tour:'pages',steps:['Go to Website → Pages and choose a page on the left.','English is on the left and Arabic on the right. The Arabic editor reads right to left.','Select text, then use the toolbar: text style (Heading 1–3, Body, Quote), size, bold, italic, underline, colour, alignment, lists and links.','Clear formatting removes styles from the selected text.','Save changes in the bar at the bottom to publish.'],tip:'Use Heading 2 for section titles so pages read well on phones.'},
  {id:'theme',t:'Choose your theme, fonts and colours',s:'Make the website match your brand.',tour:'theme',steps:['Go to Website → Theme.','Start from a theme version, then pick an English and an Arabic typeface.','Set your primary and dark colours by clicking a swatch or typing a hex value.','If a colour is too light for white text, button text switches to dark automatically and a note tells you why.','Watch the live preview on the right, and switch it to Arabic with the ع button.'],tip:'Links are darkened automatically if your primary colour would be hard to read on cards.'},
  {id:'advanced',t:'Advanced colour options',s:'Set colours section by section.',steps:['On the Theme tab, click Open advanced options.','Adjust colours for the navigation bar, tournament section, tournament cards (collapsed and expanded), sponsors and footer.','Each section shows whether its text is readable. Click Fix to correct one pair, or Fix all contrast to correct everything.','Click Save colours, then Save changes to publish.'],tip:'Cancel puts every colour back the way it was when you opened the panel.'},
  {id:'socials',t:'Add social media links',s:'Show Instagram, X, TikTok, YouTube, Twitch, Discord and more.',steps:['Go to Website → Header, footer & socials.','Turn on each network you use and type your handle.','Choose whether icons appear in the header, the footer or both.'],tip:'For Discord, paste just the invite code.'},
  {id:'general',t:'Logo, registration question and countdown',s:'The settings on the General and Home page tabs.',steps:['General: upload your logo, add an extra sign-up question such as Discord username, and set a launch countdown with its timezone.','Home page: turn sections on or off and reorder them with the arrows.','Sign-in: choose which sign-in methods players can use.'],tip:'Unsaved changes are kept if you switch tabs. You’ll be asked before leaving the Website section.'}]},
 {c:'data',ic:'chart',n:'Analytics',d:'Understand how your league is doing.',a:[
  {id:'analytics',t:'Read your analytics',s:'Tournament, user and device reports.',steps:['Go to Analytics and choose Tournaments, Users or Devices.','Change the date range at the top. Every number compares against the previous period of the same length.','Green arrows mean the change is good; red means it needs attention. For no-show and bounce rates, lower is better.','Click Export to download the data.'],tip:'Data updates every 15 minutes.'}]},
 {c:'settings',ic:'settings',n:'Settings, projects & billing',d:'Admins, roles, logs and your account.',a:[
  {id:'admins',t:'Invite admins and set roles',s:'Give colleagues the right level of access.',tour:'settings',steps:['Go to Settings → Admins and click Invite admin.','Enter their email and choose a role. The description explains what the role can do.','Change or remove access from the ⋯ menu on their row.','On Roles & permissions, tick what each role can view and edit.'],tip:'Giving edit access also gives view access automatically.'},
  {id:'logs',t:'Activity log and search settings',s:'See who changed what, and control how you appear in Google.',steps:['Settings → Activity log lists every change with who made it and when.','Search & sharing sets the page title and description shown in search results, with a live preview.'],tip:'Keep titles under 60 characters so they aren’t cut off.'},
  {id:'billing',t:'Projects, billing and your account',s:'Manage your plan and personal details.',steps:['Open your name at the top right for Account, Billing and All projects.','Billing shows your plan, usage limits and invoices.','Account lets you change your details, dashboard language and light or dark appearance.'],tip:'You’ll see a warning on Billing when you’re close to a limit.'}]},

const HA=Object.fromEntries(HELP.flatMap(c=>c.a.map(a=>[a.id,{...a,cat:c}])));
S.helpA=null;S.helpQ='';
function vHelp(){
 const head=`<div class="ph"><div><h1>Help centre</h1><p>Step-by-step guides for every page. Guides marked Tour walk you through the real screen.</p></div><div class="actions"><div class="field-search" style="min-width:280px"><label class="sr" for="hq">Search help</label>${I('search',16)}<input id="hq" data-in="helpQ" value="${esc(S.helpQ)}" placeholder="Search guides, e.g. screenshots"></div></div></div>`;
 if(S.helpA){const a=HA[S.helpA];const rel=a.cat.a.filter(x=>x.id!==a.id);
  return `<div class="crumbs"><button data-a="helpHome">Help centre</button>${I('chevr',12)}<span>${esc(a.cat.n)}</span></div>`+head+`<div class="art-wrap"><article class="article card" style="padding:26px"><h2>${esc(a.t)}</h2><p class="lede">${esc(a.s)}</p>${a.tour?`<button class="btn primary" data-a="tourStart" data-v="${a.tour}" style="margin-bottom:20px">${I('play',16)} Show me on screen</button>`:''}
   <ol>${a.steps.map(s=>`<li><span>${esc(s)}</span></li>`).join('')}</ol>${a.tip?`<div class="tip"><b>Tip:</b> ${esc(a.tip)}</div>`:''}
   <div style="display:flex;gap:10px;align-items:center;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)"><span class="muted">Was this helpful?</span><button class="btn secondary sm" data-a="toast" data-m="Thanks for the feedback">Yes</button><button class="btn secondary sm" data-a="toast" data-m="Thanks — we’ll improve this guide">No</button></div></article>
   <aside><div class="card hcat"><h3>More in ${esc(a.cat.n)}</h3>${rel.map(x=>`<button data-a="helpOpen" data-id="${x.id}">${esc(x.t)}${x.tour?'<span class="tr">Tour</span>':''}</button>`).join('')||'<p>No other guides.</p>'}</div>
   <div class="card hcat" style="margin-top:16px"><h3>Still stuck?</h3><p>Our team replies within a few hours, 7 days a week.</p><button class="btn secondary sm" data-a="toast" data-m="Support chat would open here" style="width:auto">Contact support</button></div></aside></div>`;}
 const q=S.helpQ.trim().toLowerCase();
 if(q){const hits=Object.values(HA).filter(a=>(a.t+' '+a.s+' '+a.steps.join(' ')).toLowerCase().includes(q));
  return head+`<div class="card hcat">${hits.length?`<h3>${plural(hits.length,'guide')} found</h3>${hits.map(a=>`<button data-a="helpOpen" data-id="${a.id}"><span><b>${esc(a.t)}</b><br><span class="muted" style="font-size:12.5px">${esc(a.cat.n)} · ${esc(a.s)}</span></span>${a.tour?'<span class="tr">Tour</span>':''}</button>`).join('')}`:emptyState({title:'No guides match',text:'Try another word, such as bracket, colour or verify.'})}</div>`;}
 return head+`<div class="help-hero"><div><h2>New to zemmz?</h2><p>Take a two-minute guided tour. We’ll highlight each part of the dashboard and explain what it does.</p></div><button class="btn primary" data-a="tourStart" data-v="dashboard" style="background:#fff;color:#07052E">${I('play',16)} Start the tour</button></div>
 <div class="hcats">${HELP.map(c=>`<div class="card hcat"><h3><span class="ic">${I(c.ic,17)}</span>${esc(c.n)}</h3><p>${esc(c.d)}</p>${c.a.map(a=>`<button data-a="helpOpen" data-id="${a.id}">${esc(a.t)}${a.tour?'<span class="tr">Tour</span>':''}</button>`).join('')}</div>`).join('')}
 <div class="card hcat"><h3><span class="ic">${I('list',17)}</span>Keyboard shortcuts</h3><p>Work faster without the mouse.</p><div style="display:flex;flex-direction:column;gap:10px;font-size:13.5px"><span><span class="kbd">/</span> Search tournaments and users</span><span><span class="kbd">Esc</span> Close a menu, window or tour</span><span><span class="kbd">↑</span> <span class="kbd">↓</span> Move through menu options</span><span><span class="kbd">Tab</span> Move between fields</span></div></div></div>`;
}

function tourStart(k){if(!S.proj)S.proj='p1';S.tour={k,i:0};$('#tourl')||document.body.insertAdjacentHTML('beforeend','<div id="tourl"></div>');tourStep()}
function tourEnd(){S.tour=null;const l=$('#tourl');if(l)l.innerHTML=''}
function tourStep(){
 const T=TOURS[S.tour.k],st=T[S.tour.i];if(st.pre)st.pre();
 if(S.view!==st.v)go(st.v);else render();
 $('#tourl').innerHTML=`<div class="tour-block"></div><div class="tour-spot" id="tspot"></div><div class="tour-card" role="dialog" aria-labelledby="tt"><h4 id="tt">${esc(st.t)}</h4><p>${esc(st.x)}</p><div class="ft"><span class="ct">${S.tour.i+1} of ${T.length}</span><button class="btn ghost sm" data-a="tourEnd">${S.tour.i===T.length-1?'Close':'Skip'}</button>${S.tour.i?`<button class="btn secondary sm" data-a="tourPrev">Back</button>`:''}<button class="btn primary sm" data-a="tourNext">${S.tour.i===T.length-1?'Done':'Next'}</button></div></div>`;
 const place=()=>{const el=$(st.sel),spot=$('#tspot'),card=$('.tour-card');if(!spot)return;
  if(!el){spot.style.cssText='left:50%;top:40%;width:0;height:0';card.style.left=(innerWidth/2-160)+'px';card.style.top=(innerHeight/2-80)+'px';return}
  const r=el.getBoundingClientRect(),p=6;spot.style.left=(r.left-p)+'px';spot.style.top=(r.top-p)+'px';spot.style.width=(r.width+p*2)+'px';spot.style.height=(Math.min(r.height,innerHeight-40)+p*2)+'px';
  const cw=card.offsetWidth,ch=card.offsetHeight;let top=r.bottom+14,left=r.left;if(top+ch>innerHeight-10)top=r.top-ch-14;if(top<10)top=Math.min(innerHeight-ch-10,r.top+16);if(r.width>innerWidth*.5&&r.height>innerHeight*.5){top=innerHeight-ch-24;left=innerWidth-cw-24}
  card.style.left=Math.max(10,Math.min(left,innerWidth-cw-10))+'px';card.style.top=Math.max(10,top)+'px';card.querySelector('.btn.primary').focus({preventScroll:true})};
 setTimeout(()=>{const el=$(st.sel);if(el){const r=el.getBoundingClientRect();if(r.top<120||r.bottom>innerHeight-40)el.scrollIntoView({block:'center'})}setTimeout(place,60)},S.loading?450:80);
 tourStep.place=place;
}
window.addEventListener('resize',()=>S.tour&&tourStep.place&&tourStep.place());
$('#main').addEventListener('scroll',()=>S.tour&&tourStep.place&&tourStep.place(),{passive:true});

Object.assign(A,{
 dd:el=>ddOpen(el),
 go:el=>{if(el.dataset.v==='newTournament')S.wiz=newWiz();if(el.dataset.v==='help')S.helpA=null;go(el.dataset.v)},
 attnReports:()=>{S.tab.t='reports';S.repF='open';go('tournaments')},
 repF:el=>{S.repF=el.dataset.v;S.repSel=null;render()},
 repPick:el=>{S.repSel=el.dataset.id;render()},
 lightbox:el=>{const r=S.reports.find(x=>x.id===el.dataset.r),s=r.subs[+el.dataset.i];openModal({title:`Screenshot from ${esc(s.by)}`,wide:true,body:`<img src="${s.img}" alt="Result screenshot" style="width:100%;border-radius:10px;display:block"><p class="muted" style="margin:10px 0 0">Uploaded at ${s.at}. Reported ${s.sa}–${s.sb}.</p>`})},
 repConfirm:()=>{const r=S.reports.find(x=>x.id===S.repSel),a=+$('#rsa').value,b=+$('#rsb').value;if(a===b)return;
  r.final=[a,b];r.st='confirmed';r.by='Nabil Alhaj';const t=S.tournaments.find(x=>x.id===r.t);
  if(r.br){const B=getBracket(t),m=B.r[r.br[0]].m[r.br[1]];m.sa=a;m.sb=b;advanceWinner(t,r.br[0],r.br[1])}
  S.logs.unshift(['Nabil Alhaj',`confirmed ${r.a} ${a}–${b} ${r.b} (${r.round})`,'Just now']);
  const next=S.reports.find(x=>x.st!=='confirmed');S.repSel=next?.id;toast(`${a>b?r.a:r.b} advances. Bracket updated`,()=>{r.st='review';r.final=null;S.repSel=r.id});render()},
 repReopen:()=>{const r=S.reports.find(x=>x.id===S.repSel);r.st='review';S.repF='open';toast('Result reopened');render()},
 repProof:()=>{const r=S.reports.find(x=>x.id===S.repSel);const who=r.st==='conflict'?r.subs[1].by:r.subs[0].by;
  openModal({title:'Ask for a new screenshot',body:`<div class="fld"><label for="pw">Send to</label><select id="pw" class="sel">${[r.a,r.b,'Both players'].map(n=>`<option ${n===who?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="fld"><label for="pm">Message</label><textarea id="pm" class="inp">Hi, we couldn’t confirm your result for ${esc(r.round)}. Please upload a clear, uncropped screenshot of the full result screen within 15 minutes.</textarea><span class="help">Sent by SMS and email. The report stays open until they reply.</span></div>`,
   foot:`<button class="btn secondary" data-a="closeModal">Cancel</button><button class="btn primary" id="pgo">Send request</button>`,onMount:m=>m.querySelector('#pgo').onclick=()=>{const w=m.querySelector('#pw').value;closeModal();r.st=r.st==='conflict'?'conflict':'proof';toast(`Request sent to ${w}`);render()}})},
 fixc:el=>{const a=S.site.th.adv[el.dataset.s],k=el.dataset.k;a[k]=k==='hi'?readableOn(a[k],a.bg,4.5):textOn(a.bg);colorChanged(`adv.${el.dataset.s}.${k}`,a[k]);const b=$('#advb');if(b){b.querySelectorAll(`[data-p="adv.${el.dataset.s}.${k}"]`).forEach(i=>i.value=a[k])}},
 advColors:()=>advModal(),
 prevLang:el=>{S.prevAr=el.dataset.v==='ar';render()},
 fmt:el=>edExec(el.dataset.c),
 tbColor:el=>colorPop(el), tbLink:()=>linkModal(),
 helpOpen:el=>{S.helpA=el.dataset.id;render();$('#main').scrollTop=0},
 helpHome:()=>{S.helpA=null;render()},
 tourStart:el=>tourStart(el.dataset.v),
 tourNext:()=>{if(S.tour.i<TOURS[S.tour.k].length-1){S.tour.i++;tourStep()}else{tourEnd();toast('Tour finished. Find more guides in the Help centre')}},
 tourPrev:()=>{S.tour.i--;tourStep()}, tourEnd:()=>tourEnd(),
});
Object.assign(IN,{
 color:el=>{if(isHex(el.value))colorChanged(el.dataset.p,el.value.toUpperCase())},
 colorHex:el=>{let v=el.value.trim();if(!v.startsWith('#'))v='#'+v;if(isHex(v))colorChanged(el.dataset.p,v.toUpperCase())},

 tbSize:el=>{edExec('fontSize',el.value)},
 repScore:()=>{const r=S.reports.find(x=>x.id===S.repSel);const a=$('#rsa').value,b=$('#rsb').value;$('#winline').innerHTML=winLine(r,a,b);const g=$('#repgo');if(g)g.disabled=(+a===+b)},
 helpQ:el=>{S.helpQ=el.value;S.helpA=null;const pos=el.selectionStart;render();const n=$('#hq');n.focus();n.setSelectionRange(pos,pos)},
