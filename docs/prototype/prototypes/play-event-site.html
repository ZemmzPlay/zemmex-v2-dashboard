<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gulf Esports League — Season 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --nav-bg:#07052E;--nav-ink:#FFFFFF;--nav-hi:#8C7CFF;
 --brand:#3B25E5;--brand-ink:#FFFFFF;--accent1:#FF6B4A;--accent2:#22C993;--accent3:#3B82F6;
 --bg:#F4F5FA;--surface:#FFFFFF;--surface-2:#EEEFF7;--line:#E2E2EE;--ink:#0D0B2E;--ink-2:#45445F;--muted:#737290;
 --tsec-bg:#F4F5FA;--card-bg:#FFFFFF;--sp-bg:#FFFFFF;--foot-bg:#07052E;--foot-ink:#B7B6D6;
 --ok:#0F7A52;--ok-soft:#DDF4EA;--warn:#9A5B00;--warn-soft:#FFF1D6;--info:#2549C9;--info-soft:#E6ECFF;--neutral-soft:#EBEBF3;--neutral:#55546E;
 --font:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;--font-ar:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0A1F;--surface:#15142F;--surface-2:#1C1B3C;--line:#2A2950;--ink:#F1F0FA;--ink-2:#C9C8E0;--muted:#9291B0;--tsec-bg:#0B0A1F;--card-bg:#15142F;--sp-bg:#100F28;--brand:#7C6DFF;--brand-ink:#0B0A1F;--ok:#46D39C;--ok-soft:#0F3528;--warn:#F2B650;--warn-soft:#3A2A0C;--info:#8CA6FF;--info-soft:#1B2552;--neutral-soft:#25244A;--neutral:#B3B2CC}}
:root[data-theme="dark"]{--bg:#0B0A1F;--surface:#15142F;--surface-2:#1C1B3C;--line:#2A2950;--ink:#F1F0FA;--ink-2:#C9C8E0;--muted:#9291B0;--tsec-bg:#0B0A1F;--card-bg:#15142F;--sp-bg:#100F28;--brand:#7C6DFF;--brand-ink:#0B0A1F;--ok:#46D39C;--ok-soft:#0F3528;--warn:#F2B650;--warn-soft:#3A2A0C;--info:#8CA6FF;--info-soft:#1B2552;--neutral-soft:#25244A;--neutral:#B3B2CC}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
[dir="rtl"] body,[dir="rtl"] button,[dir="rtl"] input,[dir="rtl"] select,[dir="rtl"] textarea{font-family:var(--font-ar)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
[dir="rtl"] .flip{transform:scaleX(-1)}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.demo{background:#FFD84D;color:#231A00;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:center;padding:7px 16px;flex-wrap:wrap;text-align:center}
.demo a{color:#231A00;font-weight:700}
.cd{background:var(--accent1);color:#fff;font-weight:600;font-size:14px;padding:9px 16px;text-align:center}
.cd b{font-variant-numeric:tabular-nums;letter-spacing:.02em;margin-inline-start:8px}

header.nav{position:sticky;top:0;z-index:30;background:var(--nav-bg);color:var(--nav-ink)}
header.nav .wrap{display:flex;align-items:center;gap:28px;height:68px}
.brand{display:flex;align-items:center;gap:10px;color:var(--nav-ink);text-decoration:none;font-weight:800;font-size:18px;letter-spacing:-.02em;border:0;background:none;padding:0}
.brand .mk{width:34px;height:34px;border-radius:9px;background:var(--brand);display:grid;place-items:center;font-size:13px;color:var(--brand-ink)}
.links{display:flex;gap:4px}
.links button{border:0;background:none;color:color-mix(in srgb,var(--nav-ink) 75%,transparent);padding:8px 12px;border-radius:9px;font-weight:500;font-size:14px}
.links button:hover{color:var(--nav-ink)}
.links button[aria-current="page"]{color:var(--nav-hi)}
.nav-r{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.lang{border:1px solid rgba(255,255,255,.2);background:transparent;color:var(--nav-ink);height:36px;padding:0 12px;border-radius:9px;font-weight:600;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:11px;border:1px solid transparent;font-weight:600;font-size:14.5px;white-space:nowrap;text-decoration:none}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.light{background:#fff;color:#0D0B2E}
.btn.onnav{background:transparent;border-color:rgba(255,255,255,.22);color:var(--nav-ink)}
.btn.sm{height:36px;padding:0 14px;font-size:13.5px}
.btn[disabled]{opacity:.5;pointer-events:none}
.burger{display:none;border:0;background:none;color:var(--nav-ink);width:40px;height:40px;border-radius:9px}

/* hero */
.hero{background:var(--nav-bg);color:#fff;position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-top:56px;padding-bottom:72px;position:relative;z-index:1}
.hero h1{font-size:clamp(38px,5.6vw,68px);line-height:1.02;letter-spacing:-.035em;margin:0 0 18px;font-weight:800}
[dir="rtl"] .hero h1{letter-spacing:0;line-height:1.2}
.hero p{font-size:17px;color:#C4C3E3;max-width:520px;margin:0 0 28px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.season{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:6px 12px;border-radius:999px;font-size:13px;margin-bottom:18px}
.season i{width:8px;height:8px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 4px rgba(34,201,147,.25)}
.hero-art{position:relative;aspect-ratio:1/1;max-width:460px;justify-self:end;width:100%}
.hero-art .slab{position:absolute;border-radius:22px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;color:#fff;font-weight:800;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.hero-art .s1{inset:0 18% 26% 0;justify-content:flex-start;padding-top:52px;background:linear-gradient(145deg,#FF4655,#7A0F22);font-size:30px}
.hero-art .s2{inset:34% 0 0 30%;background:linear-gradient(145deg,var(--brand),#140B6B);font-size:26px}
.hero-art .s2 small,.hero-art .s1 small{font-size:13px;font-weight:500;opacity:.85}
.hero-art .live{position:absolute;top:14px;inset-inline-start:14px;background:rgba(0,0,0,.35);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center}
.hero-art .live::before{content:"";width:7px;height:7px;border-radius:50%;background:#46F2B0}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,#000,transparent)}
.stats{display:flex;gap:36px;margin-top:36px;flex-wrap:wrap}
.stats b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em}
.stats span{color:#A9A8CE;font-size:13px}

section{padding:64px 0}
.sec-h{display:flex;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:30px;letter-spacing:-.025em;line-height:1.15}
.sec-h p{margin:6px 0 0;color:var(--muted)}
.sec-h .r{margin-inline-start:auto}
.tsec{background:var(--tsec-bg)}

/* tournament cards */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.tc{background:var(--card-bg);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.tc .art{height:150px;position:relative;display:flex;align-items:flex-end;padding:16px;color:#fff}
.tc .art .g{font-weight:800;font-size:26px;letter-spacing:-.02em;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.tc .art .pill{position:absolute;top:14px;inset-inline-start:14px}
.tc .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.tc h3{margin:0;font-size:17px;line-height:1.3}
.tc .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.tc .meta span{display:inline-flex;gap:6px;align-items:center}
.tc .foot{display:flex;gap:10px;align-items:center;margin-top:auto;padding-top:6px}
.tc .more{border-top:1px solid var(--line);padding:14px 18px;background:var(--surface-2);font-size:13.5px;color:var(--ink-2);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tc .more b{display:block;color:var(--ink);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-live{background:#DDF4EA;color:#0B6B47}.p-reg{background:#E6ECFF;color:#2549C9}.p-soon{background:#EBEBF3;color:#55546E}.p-end{background:#EBEBF3;color:#55546E}
.art .p-live,.art .p-reg,.art .p-soon,.art .p-end{background:rgba(255,255,255,.92)}
.bar{height:6px;border-radius:99px;background:var(--neutral-soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.linkbtn{border:0;background:none;padding:0;color:var(--brand);font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:13.5px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* steps */
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.how .n{width:36px;height:36px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;margin-bottom:14px}
.how h3{margin:0 0 6px;font-size:17px}.how p{margin:0;color:var(--muted);font-size:14px}

.sponsors{background:var(--sp-bg)}
.sp-row{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.sp{height:84px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:17px;letter-spacing:-.02em;color:var(--muted);background:var(--surface)}
.gal{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:180px 180px;gap:12px}
.gal div{border-radius:16px;display:flex;align-items:flex-end;padding:14px;color:#fff;font-weight:600;font-size:14px}
.gal div:first-child{grid-row:span 2}

footer{background:var(--foot-bg);color:var(--foot-ink);padding:48px 0 32px}
footer .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:24px}
footer h4{color:#fff;margin:0 0 12px;font-size:14px}
footer button.fl{display:block;border:0;background:none;color:var(--foot-ink);padding:4px 0;font-size:14px;text-align:start}
footer button.fl:hover{color:#fff}
.socials{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.socials a{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.08);display:grid;place-items:center;color:#fff}
.socials a:hover{background:rgba(255,255,255,.16)}
.legal{border-top:1px solid rgba(255,255,255,.1);margin-top:32px;padding-top:18px;font-size:13px;display:flex;gap:16px;flex-wrap:wrap}
.powered{margin-inline-start:auto;opacity:.8}

/* detail */
.dhero{color:#fff;padding:48px 0 32px}
.dhero .crumb{font-size:13px;opacity:.85;margin-bottom:12px;display:flex;gap:6px;align-items:center}
.dhero .crumb button{border:0;background:none;color:#fff;padding:0;text-decoration:underline}
.dhero h1{margin:8px 0 10px;font-size:clamp(28px,4vw,44px);letter-spacing:-.03em;line-height:1.1}
.dhero .facts{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px;font-size:14px}
.dhero .facts span{display:inline-flex;gap:8px;align-items:center;opacity:.95}
.dlayout{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start;margin-top:-8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.panel h3{margin:0 0 12px;font-size:16px}
.side{position:sticky;top:90px;display:flex;flex-direction:column;gap:14px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.kv:last-child{border:0}.kv span{color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:12px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--brand);border-color:var(--brand)}
.bracket{display:flex;gap:22px;overflow-x:auto;padding-bottom:8px}
.bcol{min-width:210px;display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.bcol h4{margin:0 0 4px;font-size:12.5px;color:var(--muted);font-weight:600}
.m{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}
.m div{display:flex;justify-content:space-between;padding:9px 12px;font-size:13.5px}.m div+div{border-top:1px solid var(--line)}
.m .w{font-weight:700;background:var(--ok-soft);color:var(--ok)}
.m .pend{color:var(--muted);font-style:italic}
table.st{width:100%;border-collapse:collapse;font-size:14px}
.st th{font-size:12px;color:var(--muted);font-weight:600;text-align:start;padding:10px 12px;border-bottom:1px solid var(--line)}
.st td{padding:11px 12px;border-bottom:1px solid var(--line)}
.st tr.q td:first-child{box-shadow:inset 3px 0 0 var(--accent2)}
[dir="rtl"] .st tr.q td:first-child{box-shadow:inset -3px 0 0 var(--accent2)}
.st .num{text-align:center;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.prose{max-width:760px}.prose h2{font-size:22px;margin:28px 0 8px}.prose p,.prose li{color:var(--ink-2)}
.faq details{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0 18px;margin-bottom:10px}
.faq summary{padding:16px 0;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";font-size:20px;color:var(--muted)}.faq details[open] summary::after{content:"–"}
.faq details p{margin:0 0 16px;color:var(--ink-2)}

/* forms */
.auth{max-width:460px;margin:48px auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px}
.auth h1{margin:0 0 6px;font-size:26px;letter-spacing:-.02em}.auth .sub{color:var(--muted);margin:0 0 20px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.inp{height:46px;border-radius:11px;border:1px solid var(--line);background:var(--bg);padding:0 14px;width:100%}
.inp:focus{outline:2px solid color-mix(in srgb,var(--brand) 40%,transparent);border-color:var(--brand)}
.fld .err{display:none;color:#C8323A;font-size:12.5px}.fld.bad .inp,.fld.bad .ph{border-color:#C8323A}.fld.bad .err{display:block}
.ph{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--bg)}
.ph select{border:0;background:var(--surface-2);padding:0 10px;appearance:none}
.ph input{border:0;background:transparent;flex:1;height:44px;padding:0 14px;min-width:0}.ph input:focus{outline:none}
.otp{display:flex;gap:10px;justify-content:center;margin:10px 0 18px;direction:ltr}
.otp input{width:54px;height:60px;text-align:center;font-size:24px;font-weight:700;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:16px 0}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.sso{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:22px;text-align:center;position:relative;color:var(--muted);background:var(--bg)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop img{max-width:100%;border-radius:10px;display:block;margin:0 auto 8px;max-height:180px}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end}
.score .vs{padding-bottom:12px;color:var(--muted);font-weight:700}
.score input{text-align:center;font-size:22px;font-weight:700}
.match-card{display:flex;gap:14px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);flex-wrap:wrap}
.match-card .teams{flex:1;min-width:220px}
.match-card .teams b{font-size:16px}
.status{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px}
.s-wait{background:var(--warn-soft);color:var(--warn)}.s-ok{background:var(--ok-soft);color:var(--ok)}.s-todo{background:var(--info-soft);color:var(--info)}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#07052E;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:80;box-shadow:0 16px 40px -12px rgba(0,0,0,.5)}
.mobile-menu{display:none}

@media (max-width:960px){
 .hero .wrap{grid-template-columns:1fr;padding-top:40px}.hero-art{max-width:340px;justify-self:start}
 .dlayout{grid-template-columns:1fr}.side{position:static}
 .how{grid-template-columns:1fr}.sp-row{grid-template-columns:repeat(3,1fr)}
 footer .cols{grid-template-columns:1fr 1fr}
 .links,.nav-r .hide-m{display:none}.burger{display:grid;place-items:center}
 .mobile-menu.open{display:flex;flex-direction:column;gap:4px;background:var(--nav-bg);padding:8px 16px 16px;border-top:1px solid rgba(255,255,255,.08)}
 .mobile-menu button{border:0;background:none;color:var(--nav-ink);text-align:start;padding:12px 8px;font-size:15px;font-weight:500;border-radius:9px}
 .gal{grid-template-columns:1fr 1fr;grid-template-rows:160px 160px 160px}.gal div:first-child{grid-column:span 2;grid-row:auto}
}
@media (max-width:560px){.wrap{padding:0 16px}section{padding:44px 0}.sec-h h2{font-size:24px}.stats{gap:22px}.sso{grid-template-columns:1fr}.otp input{width:46px;height:54px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="demo" id="demo"></div>
<div id="app"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);

}
function standings(){
 const groups=[['Group A',[['Falcons',3,3,0],['Nasr Esports',3,2,1],['Oryx',3,1,2],['Blue Sharks',3,0,3]]],['Group B',[['Team Vision',3,3,0],['Desert Wolves',3,1,2],['Qadsiah',3,1,2],['Hilal Gaming',3,1,2]]],['Group C',[['Al Arabi',3,2,1],['Kazma',3,2,1],['Sahara',3,1,2],['Najm',3,1,2]]]];
 return `<section><div class="wrap"><div class="sec-h"><div><h2>${t('standT')}</h2><p>${t('standP')}</p></div></div><p style="margin:-8px 0 20px;font-weight:600">${esc(tn(TT[0]))}</p>
 <div class="tgrid">${groups.map(([g,rows])=>`<div class="panel"><h3>${g}</h3><div class="tw"><table class="st"><thead><tr><th>${t('team')}</th><th class="num">${t('p')}</th><th class="num">${t('w')}</th><th class="num">${t('l')}</th><th class="num">${t('pts')}</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${i<2?'q':''}"><td><b>${r[0]}</b></td><td class="num">${r[1]}</td><td class="num">${r[2]}</td><td class="num">${r[3]}</td><td class="num"><b>${r[2]*3}</b></td></tr>`).join('')}</tbody></table></div></div>`).join('')}</div></div></section>`;
}
function rulesBody(){return S.lang==='ar'?`<div class="prose"><h2>القواعد العامة</h2><ul><li>سجّل جميع مبارياتك واحتفظ بالتسجيلات في حال حدوث نزاع.</li><li>لا ترسل رسائل إلى الخصوم ولا تضايقهم.</li><li>لا تتلاعب باتصالك بالإنترنت.</li></ul><h2>النتائج</h2><p>ارفع صورة لشاشة النتيجة خلال 15 دقيقة من انتهاء المباراة. يراجع المشرف الصورة ويؤكد الفائز.</p></div>`
 :`<div class="prose"><h2>General rules</h2><ul><li>Record every match and keep the recording in case of a dispute.</li><li>Do not message, harass or distract opponents.</li><li>Do not manipulate your connection to affect gameplay.</li><li>Be available during qualification windows; schedules are published here and by email.</li></ul><h2>Reporting scores</h2><p>Within 15 minutes of finishing, upload a screenshot of the result screen from My matches. An admin checks the screenshot and confirms the winner. If both players report different scores, the match is reviewed before anyone advances.</p><h2>Disqualification</h2><p>Organisers can disqualify players for cheating, using third-party helper tools, colluding or abusing known exploits.</p></div>`}
function rules(){return `<section><div class="wrap"><div class="sec-h"><h2>${t('nav')[3]}</h2></div>${rulesBody()}</div></section>`}
function faq(){const q=S.lang==='ar'?[['هل المشاركة مجانية؟','نعم، جميع بطولات الدوري مجانية.'],['من يمكنه المشاركة؟','اللاعبون في الدول المؤهلة لكل بطولة، ممن أكدوا أرقام هواتفهم.'],['كيف أرسل نتيجتي؟','من صفحة مبارياتي، أدخل النتيجة وارفع صورة لشاشة النتيجة.']]
 :[['Is it free to take part?','Yes. Every GEL tournament is free to enter.'],['Who can play?','Players in each tournament’s eligible countries who have verified their phone number.'],['How do I report my score?','Go to My matches, enter the score and upload a screenshot of the result screen. An admin confirms it, usually within 10 minutes.'],['What if my opponent reports a different score?','The match is flagged and an admin reviews both screenshots before anyone advances.'],['Can I play from outside the GCC?','Some tournaments are open to the wider Middle East. Check the eligible countries on each tournament page.']];
 return `<section><div class="wrap"><div class="sec-h"><h2>${t('nav')[4]}</h2></div><div class="faq prose">${q.map(([a,b],i)=>`<details ${i?'':'open'}><summary>${a}</summary><p>${b}</p></details>`).join('')}</div></div></section>`}
function terms(){return `<section><div class="wrap"><div class="sec-h"><h2>${S.lang==='ar'?'الشروط والأحكام':'Terms & conditions'}</h2></div><div class="prose"><p>${S.lang==='ar'?'يحق للمنظم تعديل هذه القواعد أو تحديثها لضمان اللعب النظيف للجميع.':'The organiser may change or update these rules to keep play fair for everyone. Players should review the rules for each game on the tournament page.'}</p></div></div></section>`}

function auth(mode){
 const ar=S.lang==='ar';
 if(mode==='login')return `<div class="wrap"><form class="auth" data-form="login" novalidate><h1>${t('signin')}</h1><p class="sub">${ar?'أدخل رقم هاتفك وسنرسل لك رمزاً.':'Enter your phone number and we’ll text you a code.'}</p>
  <div class="fld" id="f-lp"><label for="lp">${ar?'رقم الهاتف':'Phone number'}</label><div class="ph"><select aria-label="Country code"><option>🇰🇼 +965</option><option>🇸🇦 +966</option><option>🇦🇪 +971</option><option>🇶🇦 +974</option></select><input id="lp" inputmode="tel" placeholder="5xx xxx xx" dir="ltr"></div><span class="err">${ar?'أدخل رقماً صحيحاً.':'Enter a valid phone number.'}</span></div>
  <button class="btn primary" style="width:100%">${ar?'أرسل الرمز':'Send code'}</button><div class="or">${ar?'أو':'or'}</div><div class="sso"><button type="button" class="btn ghost" data-a="sso">${I('dc',18)} Discord</button><button type="button" class="btn ghost" data-a="sso">Google</button></div>
  <p style="text-align:center;margin:18px 0 0;font-size:14px;color:var(--muted)">${ar?'ليس لديك حساب؟':'New here?'} <button type="button" class="linkbtn" data-go="register">${t('register')}</button></p></form></div>`;
 const r=S.reg,x=TT.find(y=>y.id===r.tid);
 if(r.step===1)return `<div class="wrap"><form class="auth" data-form="otp" novalidate><h1>${ar?'أدخل الرمز':'Enter the code'}</h1><p class="sub">${ar?'أرسلنا رمزاً من 4 أرقام إلى':'We sent a 4-digit code to'} <b dir="ltr">${esc(r.phone)}</b>.</p><div class="otp">${[0,1,2,3].map(i=>`<input inputmode="numeric" maxlength="1" aria-label="Digit ${i+1}" data-otp="${i}">`).join('')}</div><button class="btn primary" style="width:100%">${ar?'تأكيد':'Verify'}</button><p style="text-align:center;font-size:13px;color:var(--muted);margin:14px 0 0">${ar?'أي 4 أرقام تعمل في هذا العرض.':'Any 4 digits work in this demo.'}</p></form></div>`;
 return `<div class="wrap"><form class="auth" data-form="register" novalidate><h1>${t('register')}</h1><p class="sub">${x?`${ar?'للتسجيل في':'To register for'} <b>${esc(tn(x))}</b>`:(ar?'انضم إلى آلاف اللاعبين في الخليج.':'Join thousands of players across the GCC.')}</p>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="fld" id="f-fn"><label for="fn">${ar?'الاسم الأول':'First name'}</label><input id="fn" class="inp" autocomplete="given-name"><span class="err">${ar?'مطلوب':'Required'}</span></div><div class="fld" id="f-ln"><label for="ln">${ar?'اسم العائلة':'Last name'}</label><input id="ln" class="inp" autocomplete="family-name"><span class="err">${ar?'مطلوب':'Required'}</span></div></div>
  <div class="fld" id="f-rp"><label for="rp">${ar?'رقم الهاتف':'Phone number'}</label><div class="ph"><select id="rcc" aria-label="Country code"><option>+965</option><option>+966</option><option>+971</option><option>+974</option><option>+973</option><option>+968</option></select><input id="rp" inputmode="tel" placeholder="5xx xxx xx" dir="ltr"></div><span class="err">${ar?'أدخل رقماً صحيحاً.':'Enter a valid phone number.'}</span></div>
  <div class="fld"><label for="dc">${ar?'اسم المستخدم في ديسكورد':'Discord username'}</label><input id="dc" class="inp" placeholder="e.g. falcon#1234" dir="ltr"></div>
  <label style="display:flex;gap:10px;font-size:13.5px;color:var(--ink-2);margin:4px 0 16px;align-items:flex-start"><input type="checkbox" id="tc" style="margin-top:3px;accent-color:var(--brand)"> <span>${ar?'أوافق على':'I agree to the'} <button type="button" class="linkbtn" data-go="terms" style="font-size:13.5px">${ar?'الشروط والأحكام':'terms & conditions'}</button></span></label>
  <button class="btn primary" style="width:100%">${ar?'متابعة':'Continue'}</button></form></div>`;
}
function me(){
 const ar=S.lang==='ar',sub=S.sub;
 const m1=`<div class="match-card"><div style="width:54px;height:54px;border-radius:12px;${art('val')}"></div><div class="teams"><div style="font-size:13px;color:var(--muted)">${esc(tn(TT[0]))} · ${ar?'الجولة 4':'Round 4'}</div><b>Falcons</b> <span style="color:var(--muted)">vs</span> <b>Team Vision</b><div style="font-size:13px;color:var(--muted);margin-top:2px">${ar?'اليوم 19:00 بتوقيت الخليج':'Today, 19:00 GST'}</div></div>
  ${sub.m1?`<span class="status s-wait">${ar?'بانتظار تأكيد المشرف':'Waiting for admin to confirm'}</span>`:`<span class="status s-todo">${ar?'أرسل النتيجة':'Result needed'}</span><button class="btn primary sm" data-a="report">${ar?'أرسل النتيجة':'Report result'}</button>`}</div>`;
 const form=S.reporting?`<form class="panel" data-form="score" style="margin-top:14px" novalidate><h3>${ar?'أرسل نتيجة المباراة':'Report match result'}</h3><p style="margin:0 0 16px;color:var(--muted);font-size:14px">${ar?'أدخل النتيجة وارفع صورة لشاشة النتيجة. سيتحقق المشرف منها.':'Enter the score and upload a screenshot of the result screen. An admin checks it before the bracket updates.'}</p>
  <div class="score"><div class="fld"><label for="s1">Falcons (${ar?'أنت':'you'})</label><input id="s1" class="inp" type="number" min="0" value="13"></div><span class="vs">–</span><div class="fld"><label for="s2">Team Vision</label><input id="s2" class="inp" type="number" min="0" value="9"></div></div>
  <div class="fld" id="f-shot"><label>${ar?'صورة النتيجة':'Result screenshot'}</label><div class="drop" id="drop">${S.shot?`<img src="${S.shot}" alt="Uploaded screenshot">`:I('upload',26)}<div>${S.shot?(ar?'اضغط لاستبدال الصورة':'Click to replace'):(ar?'اسحب صورة أو اضغط للرفع':'Drop a screenshot here or click to upload')}</div><input type="file" accept="image/*" id="shot" aria-label="Upload screenshot"></div><span class="err">${ar?'ارفع صورة للنتيجة.':'Upload a screenshot of the result.'}</span></div>
  <div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn ghost" data-a="cancelrep">${ar?'إلغاء':'Cancel'}</button><button class="btn primary">${ar?'أرسل للمراجعة':'Submit for review'}</button></div></form>`:'';
 return `<section><div class="wrap" style="max-width:860px"><div class="sec-h"><div><h2>${t('myMatches')}</h2><p>${ar?'مرحباً':'Welcome back,'} ${esc(S.user)}.</p></div><div class="r"><button class="btn ghost sm" data-a="signout">${t('signout')}</button></div></div>
 ${m1}${form}<div class="match-card" style="margin-top:12px;opacity:.85"><div style="width:54px;height:54px;border-radius:12px;${art('val')}"></div><div class="teams"><div style="font-size:13px;color:var(--muted)">${esc(tn(TT[0]))} · ${ar?'الجولة 3':'Round 3'}</div><b>Falcons</b> 13 – 11 <b>Oryx</b></div><span class="status s-ok">${ar?'تم التأكيد · فوز':'Confirmed · Won'}</span></div>
 ${S.regged?`<div class="match-card" style="margin-top:12px"><div style="width:54px;height:54px;border-radius:12px;${art(TT.find(y=>y.id===S.regged).g)}"></div><div class="teams"><b>${esc(tn(TT.find(y=>y.id===S.regged)))}</b><div style="font-size:13px;color:var(--muted)">${ar?'مسجّل · يبدأ':'Registered · starts'} ${TT.find(y=>y.id===S.regged).start}</div></div><span class="status s-ok">${ar?'مسجّل':'Registered'}</span></div>`:''}</div></section>`;
}

function render(){
 document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
 $('#demo').innerHTML=S.lang==='ar'?'هذا موقع تجريبي لبطولة تم إنشاؤه باستخدام zemmz. البيانات غير حقيقية.':'This is a demo tournament website built with zemmz. Data is sample only.';
 const V={home,tournaments:list,t:detail,standings,rules,faq,terms,login:()=>auth('login'),register:()=>auth('register'),me};
 $('#app').innerHTML=nav()+`<main id="main">${V[S.route]()}</main>`+footer();
 tick();
}
function go(r,extra={}){Object.assign(S,{route:r,menu:false},extra);render();window.scrollTo(0,0)}
function tick(){const el=$('#cdv');if(!el)return;const end=Date.UTC(2026,9,30,16,0),d=Math.max(0,end-Date.now());const dd=Math.floor(d/864e5),h=Math.floor(d/36e5)%24,m=Math.floor(d/6e4)%60,s=Math.floor(d/1e3)%60;
 el.textContent=S.lang==='ar'?`${dd} يوم ${h} ساعة ${m} دقيقة ${s} ثانية`:`${dd}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`}
setInterval(tick,1000);

document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){e.preventDefault();const r=g.dataset.go;go(r,r==='register'?{reg:{step:0}}:{});return}
 const tt=e.target.closest('[data-t]');if(tt){go('t',{tid:tt.dataset.t,tab:'overview'});return}
 const rg=e.target.closest('[data-reg]');if(rg){if(S.user){S.regged=rg.dataset.reg;toast(S.lang==='ar'?'تم تسجيلك!':'You’re registered!');go('me')}else go('register',{reg:{step:0,tid:rg.dataset.reg}});return}
 const tb=e.target.closest('[data-tab]');if(tb){S.tab=tb.dataset.tab;render();return}
 const gf=e.target.closest('[data-gf]');if(gf){S.gf=gf.dataset.gf;render();return}
 const sf=e.target.closest('[data-sf]');if(sf){S.sf=sf.dataset.sf;render();return}
 const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a;
 if(k==='lang'){S.lang=S.lang==='en'?'ar':'en';render()}
 if(k==='menu'){S.menu=!S.menu;render()}
 if(k==='how'){$('#how').scrollIntoView({behavior:'smooth'})}
 if(k==='clearf'){S.gf='all';S.sf='all';render()}
 if(k==='soc'){e.preventDefault();toast('Opens the league’s social profile')}
 if(k==='sso'){S.user='Falcons';toast(S.lang==='ar'?'تم تسجيل الدخول':'Signed in');go('me')}
 if(k==='report'){S.reporting=true;render()}
 if(k==='cancelrep'){S.reporting=false;S.shot=null;render()}
 if(k==='signout'){S.user=null;go('home')}
});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target.dataset.form;const ar=S.lang==='ar';
 if(f==='login'){const ok=$('#lp').value.replace(/\D/g,'').length>=7;$('#f-lp').classList.toggle('bad',!ok);if(!ok)return;S.reg={step:1,phone:$('.ph select').value.split(' ').pop()+' '+$('#lp').value,login:true};S.route='register';render()}
 if(f==='register'){let ok=true;[['#f-fn','#fn',v=>v.trim()],['#f-ln','#ln',v=>v.trim()],['#f-rp','#rp',v=>v.replace(/\D/g,'').length>=7]].forEach(([w,i,c])=>{const g=c($(i).value);$(w).classList.toggle('bad',!g);if(!g)ok=false});
  if(!$('#tc').checked){toast(ar?'يرجى الموافقة على الشروط':'Please accept the terms to continue');ok=false}if(!ok)return;
  S.reg={...S.reg,step:1,phone:$('#rcc').value+' '+$('#rp').value,name:$('#fn').value.trim()};render();setTimeout(()=>$('[data-otp="0"]')?.focus(),30)}
 if(f==='otp'){const code=[...document.querySelectorAll('[data-otp]')].map(i=>i.value).join('');if(code.length<4){toast(ar?'أدخل الأرقام الأربعة':'Enter all 4 digits');return}
  S.user=S.reg.name||'Falcons';if(S.reg.tid)S.regged=S.reg.tid;toast(S.reg.tid?(ar?'تم تأكيد رقمك وتسجيلك!':'Number verified — you’re registered!'):(ar?'تم تسجيل الدخول':'Signed in'));go('me')}
 if(f==='score'){if(!S.shot){$('#f-shot').classList.add('bad');return}S.sub.m1=true;S.reporting=false;toast(ar?'أُرسلت النتيجة. سيؤكدها المشرف قريباً.':'Result sent. An admin will confirm it shortly.');render()}
});
document.addEventListener('input',e=>{const o=e.target.closest('[data-otp]');if(o&&o.value){const n=document.querySelector(`[data-otp="${+o.dataset.otp+1}"]`);n&&n.focus()}});
document.addEventListener('change',e=>{if(e.target.id==='shot'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.shot=r.result;render()};r.readAsDataURL(f)}});
render();
</script>
</body>
</html>
