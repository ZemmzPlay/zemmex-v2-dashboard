<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zemmz Live — conference registration, check-in and CME certificates</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --navy:#00032E;--navy-2:#0D1247;--brand:#0B5CFF;--brand-hover:#0848CC;--brand-soft:#E6EEFF;--coral:#FF6B4A;--mint:#00E6A0;--sky:#3B82F6;
 --bg:#F4F5FA;--surface:#FFFFFF;--surface-2:#F8F8FC;--line:#E4E4EF;--line-2:#D4D4E3;--ink:#0D0B2E;--ink-2:#45445F;--muted:#737290;
 --ok:#0F7A52;--ok-soft:#DFF5EC;--danger:#C8323A;
 --font:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0A1F;--surface:#15142F;--surface-2:#1B1A3B;--line:#2A2950;--line-2:#3A3966;--ink:#F1F0FA;--ink-2:#C9C8E0;--muted:#9291B0;--brand-soft:#16264F;--ok:#46D39C;--ok-soft:#0F3528;--danger:#FF7A80}}
:root[data-theme="dark"]{--bg:#0B0A1F;--surface:#15142F;--surface-2:#1B1A3B;--line:#2A2950;--line-2:#3A3966;--ink:#F1F0FA;--ink-2:#C9C8E0;--muted:#9291B0;--brand-soft:#16264F;--ok:#46D39C;--ok-soft:#0F3528;--danger:#FF7A80}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15.5px/1.6 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:12px;border:1px solid transparent;font-weight:600;font-size:15px;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s}
.btn.primary{background:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-hover)}
.btn.ghost{background:transparent;border-color:var(--line-2);color:var(--ink)}.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.light{background:#fff;color:var(--navy)}.btn.light:hover{background:#ECEBFF}
.btn.onnav{background:transparent;border-color:rgba(255,255,255,.22);color:#fff}.btn.onnav:hover{border-color:#fff}
.btn.sm{height:38px;padding:0 16px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.linkbtn{border:0;background:none;padding:0;color:var(--brand);font-weight:600;font-size:inherit}

/* nav */
header.nav{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff}
header.nav .wrap{display:flex;align-items:center;gap:32px;height:72px}
.logo{font:800 26px/1 var(--font);letter-spacing:-.045em;color:#fff;border:0;background:none;padding:0}
.links{display:flex;gap:4px}
.links button{border:0;background:none;color:#B9B8D8;padding:8px 12px;border-radius:9px;font-weight:500;font-size:14.5px}
.links button:hover{color:#fff}
.nav-r{margin-left:auto;display:flex;gap:10px;align-items:center}
.burger{display:none;border:0;background:none;color:#fff;width:42px;height:42px}
.mmenu{display:none}

/* hero */
.hero{background:var(--navy);color:#fff;overflow:hidden;position:relative}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:48px;align-items:center;padding-top:64px;padding-bottom:88px}
.hero h1{font-size:clamp(40px,5.4vw,70px);line-height:1.02;letter-spacing:-.04em;margin:0 0 20px;font-weight:800}
.hero .lede{font-size:18px;color:#C4C3E3;margin:0 0 30px;max-width:520px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero .fine{margin-top:16px;font-size:13px;color:#8F8EB8}
.badge-new{display:inline-flex;gap:8px;align-items:center;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 12px 5px 6px;font-size:13px;margin-bottom:22px;color:#D6D5F0}
.badge-new b{background:var(--coral);color:#fff;border-radius:999px;padding:1px 8px;font-size:11.5px}

/* live builder demo */
.demo{position:relative}
.browser{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08);color:#0D0B2E;transition:transform .3s}
.bbar{height:36px;background:#EDEDF4;display:flex;align-items:center;gap:6px;padding:0 12px}
.bbar i{width:10px;height:10px;border-radius:50%;background:#CFCFDD}
.bbar span{margin-left:12px;flex:1;background:#fff;border-radius:7px;height:22px;display:flex;align-items:center;padding:0 10px;font-size:11.5px;color:#737290}
.site{--c:#3B25E5;--ct:#fff;font-size:12px}
.site .snav{background:var(--nav,#07052E);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 16px;transition:background .35s}
.site .snav b{font-size:14px}.site .snav span{opacity:.7}
.site .snav .cta{margin-left:auto;background:var(--c);color:var(--ct);padding:6px 12px;border-radius:8px;font-weight:700;opacity:1;transition:background .35s,color .35s}
.site .shero{background:linear-gradient(135deg,var(--nav,#07052E),color-mix(in srgb,var(--c) 70%,#000));color:#fff;padding:22px 16px 26px;transition:background .35s}
.site .shero h4{margin:0 0 6px;font-size:22px;letter-spacing:-.02em;line-height:1.1}
.site .shero p{margin:0 0 12px;opacity:.8}
.site .sbtn{display:inline-block;background:var(--c);color:var(--ct);border-radius:8px;padding:7px 14px;font-weight:700;transition:background .35s,color .35s}
.site .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px;background:#F4F5FA}
.site .card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 4px 12px -6px rgba(0,0,0,.2)}
.site .card .art{height:54px;display:flex;align-items:flex-end;padding:6px 8px;color:#fff;font-weight:800}
.site .card .bd{padding:8px}
.site .card .bar{height:5px;border-radius:9px;background:#E7E7F0;margin-top:6px}.site .card .bar i{display:block;height:100%;border-radius:9px;background:var(--c);transition:background .35s}
.swatches{position:absolute;left:-18px;bottom:28px;background:#fff;color:#0D0B2E;border-radius:14px;padding:12px 14px;box-shadow:0 20px 40px -12px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:8px}
.swatches small{font-size:11.5px;color:#737290;font-weight:500}
.swatches div{display:flex;gap:8px}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px #0D0B2E}
.floating{position:absolute;right:-14px;top:70px;background:#fff;color:#0D0B2E;border-radius:14px;padding:10px 12px;box-shadow:0 20px 40px -12px rgba(0,0,0,.55);font-size:12.5px;display:flex;gap:10px;align-items:center;max-width:250px}
.floating .ok{width:28px;height:28px;border-radius:50%;background:#DFF5EC;color:#0F7A52;display:grid;place-items:center;flex:none}

section{padding:88px 0}
.eyebrow{color:var(--brand);font-weight:600;font-size:14px;margin:0 0 10px}
h2.big{font-size:clamp(30px,3.6vw,46px);line-height:1.08;letter-spacing:-.035em;margin:0 0 14px}
.sub{color:var(--ink-2);font-size:17px;max-width:620px;margin:0}
.logos{padding:34px 0;border-bottom:1px solid var(--line);background:var(--surface)}
.logos .wrap{display:flex;align-items:center;gap:14px 40px;flex-wrap:wrap;justify-content:space-between}
.logos p{margin:0;color:var(--muted);font-size:13.5px;flex-basis:100%;text-align:center}
.logos span{font-weight:800;font-size:19px;letter-spacing:-.03em;color:var(--muted)}

.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:40px;counter-reset:s}
.steps3 div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;position:relative}
.steps3 .n{font-size:13px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:8px;padding:2px 10px;display:inline-block;margin-bottom:14px}
.steps3 h3{margin:0 0 6px;font-size:19px;letter-spacing:-.02em}.steps3 p{margin:0;color:var(--ink-2);font-size:14.5px}
.steps3 .time{margin-top:14px;font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}

.feat{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding:56px 0;border-top:1px solid var(--line)}
.feat:first-of-type{border-top:0}
.feat.rev .txt{order:2}
.feat h3{font-size:30px;letter-spacing:-.03em;line-height:1.12;margin:0 0 12px}
.feat p{color:var(--ink-2);margin:0 0 16px}
.feat ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.feat li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.feat li svg{color:var(--ok);margin-top:3px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 24px 50px -30px rgba(13,11,46,.35)}
.mini-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px}
.mini-h b{font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-red{background:#FDE7E8;color:#C8323A}.p-ok{background:#DFF5EC;color:#0F7A52}.p-warn{background:#FFF2D9;color:#9A5B00}.p-blue{background:#E7EDFF;color:#2549C9}
.shotrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.shotrow div{aspect-ratio:16/9;border-radius:10px;background:linear-gradient(135deg,#15B86F,#063B27);color:#fff;display:grid;place-items:center;text-align:center;font-weight:900;font-size:22px;position:relative;overflow:hidden}
.shotrow div small{display:block;font-size:10px;font-weight:600;opacity:.8}
.shotrow .crop::after{content:"";position:absolute;inset:0 0 0 55%;background:#000}
.scorein{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.scorein span.box{border:1px solid var(--line-2);border-radius:10px;height:48px;display:grid;place-items:center;font-size:22px;font-weight:800}
.winl{margin-top:10px;color:var(--ok);font-size:13px;font-weight:600}
.bil{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bil div{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px}
.bil h5{margin:0 0 6px;font-size:15px}
.bil [dir="rtl"]{font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif}
.mtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.mtbl td{padding:8px 6px;border-bottom:1px solid var(--line)}
.mtbl tr:last-child td{border:0}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;margin-right:6px;vertical-align:middle}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:10px}
.bars i{flex:1;background:var(--brand);border-radius:6px 6px 2px 2px;opacity:.85}
.bars i:last-child{opacity:1;background:var(--coral)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.kpis div{background:var(--surface-2);border-radius:10px;padding:10px}
.kpis b{display:block;font-size:20px;letter-spacing:-.02em}.kpis span{font-size:11.5px;color:var(--muted)}

.band{background:var(--navy);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.stats b{display:block;font-size:44px;letter-spacing:-.04em;line-height:1}
.stats span{color:#A9A8CE;font-size:14px}
.quote{margin-top:56px;display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start;border-top:1px solid rgba(255,255,255,.1);padding-top:40px}
.quote .qm{font-size:80px;line-height:.8;color:var(--coral);font-weight:800}
.quote p{font-size:22px;line-height:1.45;margin:0 0 16px;letter-spacing:-.01em}
.quote cite{font-style:normal;color:#A9A8CE;font-size:14px}

/* pricing */
.toggle{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin:26px 0 30px}
.toggle button{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--navy);color:#fff}
.toggle em{font-style:normal;color:var(--ok);font-size:12px;margin-left:4px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:stretch}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px;display:flex;flex-direction:column}
.plan.pop{border:2px solid var(--brand);position:relative}
.plan.pop::before{content:"Most popular";position:absolute;top:-13px;left:24px;background:var(--brand);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.plan h3{margin:0 0 4px;font-size:20px}.plan .for{color:var(--muted);font-size:14px;margin:0 0 18px;min-height:44px}
.price{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}.price small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}
.plan .note{font-size:13px;color:var(--muted);margin:6px 0 20px;min-height:20px}
.plan ul{list-style:none;padding:0;margin:20px 0 0;display:flex;flex-direction:column;gap:10px;font-size:14px}
.plan li{display:flex;gap:10px}.plan li svg{color:var(--ok);margin-top:3px}
.faq{max-width:780px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{padding:20px 0;font-weight:600;font-size:16.5px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::after{content:"+";color:var(--muted);font-size:22px;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq p{margin:0 0 20px;color:var(--ink-2)}
.cta-band{background:var(--brand);color:#fff;border-radius:24px;padding:48px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.cta-band h2{margin:0;font-size:34px;letter-spacing:-.03em;line-height:1.1;flex:1;min-width:260px}
footer{padding:56px 0 36px;border-top:1px solid var(--line);margin-top:88px}
footer .cols{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:24px}
footer h4{margin:0 0 12px;font-size:14px}
footer button.fl{display:block;border:0;background:none;padding:4px 0;color:var(--ink-2);font-size:14px;text-align:left}
footer button.fl:hover{color:var(--brand)}
footer .legal{margin-top:36px;color:var(--muted);font-size:13px;display:flex;gap:18px;flex-wrap:wrap}

/* auth + onboarding */
.ob{min-height:100vh;display:grid;grid-template-columns:420px 1fr}
.ob-side{background:var(--navy);color:#fff;padding:36px;display:flex;flex-direction:column;gap:30px;position:sticky;top:0;height:100vh}
.ob-side .logo{font-size:28px}
.ob-steps{display:flex;flex-direction:column;gap:4px}
.ob-step{display:flex;gap:14px;align-items:center;padding:10px 0;color:#8F8EB8;font-size:14.5px}
.ob-step .d{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.ob-step.cur{color:#fff}.ob-step.cur .d{border-color:#fff;background:#fff;color:var(--navy)}
.ob-step.done{color:#D6D5F0}.ob-step.done .d{background:var(--mint);border-color:var(--mint);color:#062A1D}
.ob-side .foot{margin-top:auto;font-size:13px;color:#8F8EB8}
.ob-side blockquote{margin:0;padding:18px;border-radius:14px;background:rgba(255,255,255,.06);font-size:14px;color:#D6D5F0}
.ob-main{padding:48px;display:flex;flex-direction:column;align-items:center}
.ob-card{width:100%;max-width:560px}
.ob-card h1{font-size:32px;letter-spacing:-.03em;margin:0 0 8px;line-height:1.1}
.ob-card .lead{color:var(--ink-2);margin:0 0 28px}
.ob-top{width:100%;max-width:560px;display:flex;align-items:center;gap:12px;margin-bottom:28px;font-size:13.5px;color:var(--muted)}
.ob-top .prog{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}.ob-top .prog i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;min-width:0}
.fld label,.fld .lbl{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.opt{color:var(--muted);font-weight:400;font-size:12.5px;margin-left:4px}
.inp{height:48px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);padding:0 14px;width:100%}
.inp:focus{outline:2px solid color-mix(in srgb,var(--brand) 35%,transparent);border-color:var(--brand)}
.fld .help{font-size:12.5px;color:var(--muted)}
.fld .err{display:none;font-size:12.5px;color:var(--danger)}
.fld.bad .inp,.fld.bad .joined,.fld.bad .dd-btn{border-color:var(--danger)}.fld.bad .err{display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.joined{display:flex;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:var(--surface)}
.joined input{border:0;flex:1;height:46px;padding:0 14px;background:transparent;min-width:0}.joined input:focus{outline:none}
.joined span{padding:0 14px;display:grid;place-items:center;background:var(--surface-2);border-left:1px solid var(--line);color:var(--muted);font-size:14px}
.pw{position:relative}.pw button{position:absolute;right:8px;top:8px;height:32px;border:0;background:none;color:var(--muted);font-size:13px;font-weight:600}
.meter{display:flex;gap:4px;margin-top:4px}.meter i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.meter.s1 i:nth-child(1){background:var(--danger)}.meter.s2 i:nth-child(-n+2){background:#E0A100}.meter.s3 i:nth-child(-n+3){background:var(--ok)}.meter.s4 i{background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink-2)}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.otp{display:flex;gap:10px;margin:8px 0 20px}
.otp input{width:56px;height:62px;text-align:center;font-size:26px;font-weight:700;border-radius:12px;border:1px solid var(--line-2);background:var(--surface)}
.otp input:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.sso{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:18px 0}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.ob-nav{display:flex;gap:10px;align-items:center;margin-top:24px}.ob-nav .sp{flex:1}
.dd{position:relative}.dd-btn{height:48px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);padding:0 14px;text-align:left}
.dd-btn:hover{border-color:var(--brand)}.dd-btn[aria-expanded="true"]{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.dd-btn svg{color:var(--muted)}
.dd-list{position:absolute;left:0;right:0;top:54px;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -16px rgba(13,11,46,.35);padding:6px;max-height:260px;overflow:auto}
.dd-list button{display:flex;justify-content:space-between;width:100%;border:0;background:transparent;padding:10px 12px;border-radius:8px;text-align:left;font-size:14px}
.dd-list button:hover,.dd-list button:focus-visible{background:var(--surface-2)}

/* ============ calm homepage ============ */
:root{--z-paper:#FFFFFF;--z-mist:#F3F4F8;--z-ink:#14142B;--z-slate:#56597A;--z-rule:#E1E3EC;--z-blue:#321EDC;--z-blue-d:#2616B8;--z-link:#321EDC;--z-on:#22A06B;
 --font:'Schibsted Grotesk','Helvetica Neue',Arial,sans-serif;--brand:#321EDC;--navy:#321EDC}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--z-paper:#0F1022;--z-mist:#16172E;--z-ink:#ECEDF7;--z-slate:#A5A8C4;--z-rule:#282A46;--z-link:#9C92FF}}
:root[data-theme="dark"]{--z-paper:#0F1022;--z-mist:#16172E;--z-ink:#ECEDF7;--z-slate:#A5A8C4;--z-rule:#282A46;--z-link:#9C92FF}
.z{background:var(--z-paper);color:var(--z-ink);font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased}
.z *{box-sizing:border-box}
.z .w{max-width:1160px;margin:0 auto;padding:0 32px}
.z h1,.z h2,.z h3{font-family:var(--font);color:var(--z-ink);margin:0}
.z p{margin:0}
.z a{color:var(--z-link)}
.z :focus-visible{outline:3px solid var(--z-blue);outline-offset:3px;border-radius:4px}
.zlogo{display:block;width:110px;height:18px;background:var(--z-logo,var(--z-blue));-webkit-mask:var(--logo-mask) left center/contain no-repeat;mask:var(--logo-mask) left center/contain no-repeat}

 if(o.step===2)err=bad('f-org',!d.org.trim())|bad('f-otype',!d.otype);
 if(o.step===3)err=bad('f-etype',!d.etype);
 if(o.step===4)err=bad('f-ev',!d.ev.trim())|bad('f-start',!d.start)|bad('f-end',bt()!=='concert'&&(!d.end||d.end<d.start));
 if(o.step===5)d.tickets.forEach((t,i)=>{if(bad('f-tk'+i,!t.n.trim()))err=true});
